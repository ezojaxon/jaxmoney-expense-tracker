<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta name="theme-color" content="#c91f35">
     <title>RedNote — Your Personal Notes</title>

     <style>
          :root {
               --red: #c91f35;
               --red-dark: #a8172b;
               --red-light: #fff0f2;
               --white: #ffffff;
               --bg: #f7f7f9;
               --text: #24242b;
               --muted: #888891;
               --border: #eeeeef;
               --sidebar: 280px;
          }

          * {
               box-sizing: border-box;
               margin: 0;
               padding: 0;
          }

          body {
               font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
               background: var(--bg);
               color: var(--text);
               height: 100vh;
               overflow: hidden;
          }

          button,
          input {
               font: inherit;
          }

          button {
               cursor: pointer;
          }

          .app {
               height: 100vh;
               display: flex;
          }

          /* SIDEBAR */

          .sidebar {
               width: var(--sidebar);
               min-width: var(--sidebar);
               background: white;
               border-right: 1px solid var(--border);
               display: flex;
               flex-direction: column;
               z-index: 10;
          }

          .brand {
               height: 75px;
               padding: 0 24px;
               display: flex;
               align-items: center;
               gap: 11px;
               border-bottom: 1px solid var(--border);
          }

          .brand-icon {
               width: 38px;
               height: 38px;
               background: var(--red);
               color: white;
               border-radius: 12px;
               display: grid;
               place-items: center;
               font-size: 21px;
               font-weight: 800;
          }

          .brand h2 {
               font-size: 21px;
               letter-spacing: -1px;
          }

          .brand h2 span {
               color: var(--red);
          }

          .sidebar-content {
               padding: 23px 15px;
               flex: 1;
               overflow-y: auto;
          }

          .new-note {
               width: 100%;
               background: var(--red);
               color: white;
               border: none;
               padding: 14px;
               border-radius: 10px;
               font-weight: 650;
               display: flex;
               align-items: center;
               justify-content: center;
               gap: 9px;
               transition: .2s;
          }

          .new-note:hover {
               background: var(--red-dark);
               transform: translateY(-1px);
          }

          .nav-label {
               font-size: 10px;
               color: var(--muted);
               font-weight: 800;
               letter-spacing: 1.3px;
               margin: 30px 10px 12px;
          }

          .nav-item {
               display: flex;
               align-items: center;
               gap: 12px;
               padding: 12px;
               border-radius: 9px;
               color: #64646d;
               font-size: 13px;
               cursor: pointer;
               margin-bottom: 4px;
          }

          .nav-item.active,
          .nav-item:hover {
               background: var(--red-light);
               color: var(--red);
          }

          .nav-item .count {
               margin-left: auto;
               font-size: 11px;
               color: var(--muted);
          }

          .search-box {
               margin-top: 22px;
               position: relative;
          }

          .search-box input {
               width: 100%;
               padding: 12px 12px 12px 37px;
               border: 1px solid var(--border);
               border-radius: 9px;
               outline: none;
               font-size: 12px;
               background: #fafafa;
          }

          .search-box input:focus {
               border-color: var(--red);
          }

          .search-icon {
               position: absolute;
               left: 12px;
               top: 11px;
               color: var(--muted);
          }

          .notes-heading {
               display: flex;
               align-items: center;
               justify-content: space-between;
               margin: 27px 5px 12px;
          }

          .notes-heading h3 {
               font-size: 11px;
               letter-spacing: 1px;
               color: var(--muted);
          }

          .notes-heading span {
               color: var(--muted);
               font-size: 11px;
          }

          .note-list {
               display: flex;
               flex-direction: column;
               gap: 5px;
          }

          .note-card {
               padding: 13px;
               border-radius: 9px;
               cursor: pointer;
               border: 1px solid transparent;
               transition: .15s;
          }

          .note-card:hover {
               background: #fafafa;
          }

          .note-card.selected {
               background: var(--red-light);
               border-color: #ffe0e5;
          }

          .note-card h4 {
               font-size: 13px;
               margin-bottom: 6px;
               font-weight: 650;
               overflow: hidden;
               white-space: nowrap;
               text-overflow: ellipsis;
          }

          .note-card p {
               font-size: 11px;
               color: var(--muted);
               white-space: nowrap;
               overflow: hidden;
               text-overflow: ellipsis;
          }

          .note-card small {
               display: block;
               font-size: 10px;
               color: #aaa;
               margin-top: 8px;
          }

          .sidebar-footer {
               padding: 17px;
               border-top: 1px solid var(--border);
               font-size: 11px;
               color: var(--muted);
               text-align: center;
          }

          /* MAIN AREA */

          .main {
               flex: 1;
               min-width: 0;
               display: flex;
               flex-direction: column;
          }

          .topbar {
               height: 75px;
               min-height: 75px;
               background: white;
               border-bottom: 1px solid var(--border);
               display: flex;
               justify-content: space-between;
               align-items: center;
               padding: 0 30px;
          }

          .topbar-left {
               display: flex;
               align-items: center;
               gap: 14px;
          }

          .topbar-title {
               font-size: 13px;
               font-weight: 650;
          }

          .save-status {
               font-size: 11px;
               color: #999;
          }

          .topbar-actions {
               display: flex;
               align-items: center;
               gap: 9px;
          }

          .icon-btn {
               width: 37px;
               height: 37px;
               border: 1px solid var(--border);
               background: white;
               border-radius: 9px;
               font-size: 16px;
               color: #555;
          }

          .icon-btn:hover {
               background: var(--red-light);
               color: var(--red);
               border-color: #ffd5dc;
          }

          .mobile-menu {
               display: none;
          }

          .content {
               flex: 1;
               overflow-y: auto;
               padding: 45px 8%;
          }

          .editor-container {
               max-width: 900px;
               margin: 0 auto;
          }

          .editor-meta {
               display: flex;
               align-items: center;
               gap: 10px;
               color: var(--muted);
               font-size: 11px;
               margin-bottom: 24px;
          }

          .editor-meta .dot {
               width: 5px;
               height: 5px;
               background: var(--red);
               border-radius: 50%;
          }

          .title-input {
               width: 100%;
               border: none;
               background: transparent;
               outline: none;
               font-size: clamp(27px, 4vw, 39px);
               font-weight: 750;
               color: var(--text);
               letter-spacing: -1.5px;
               margin-bottom: 23px;
          }

          .title-input::placeholder {
               color: #d2d2d6;
          }

          .toolbar {
               display: flex;
               align-items: center;
               gap: 5px;
               border-top: 1px solid var(--border);
               border-bottom: 1px solid var(--border);
               padding: 11px 0;
               margin-bottom: 23px;
               flex-wrap: wrap;
          }

          .tool-btn {
               min-width: 34px;
               height: 32px;
               border: none;
               border-radius: 6px;
               background: transparent;
               color: #555;
               font-size: 13px;
          }

          .tool-btn:hover {
               background: var(--red-light);
               color: var(--red);
          }

          .tool-divider {
               height: 20px;
               width: 1px;
               background: var(--border);
               margin: 0 6px;
          }

          .editor {
               min-height: 300px;
               font-size: 15px;
               line-height: 1.9;
               outline: none;
               color: #44444c;
               overflow-wrap: anywhere;
          }

          .editor:empty:before {
               content: "Start writing your thoughts...";
               color: #c5c5cb;
               pointer-events: none;
          }

          .editor h2 {
               margin: 15px 0 8px;
          }

          .editor ul,
          .editor ol {
               padding-left: 25px;
          }

          .editor a {
               color: var(--red);
          }

          /* ATTACHMENTS */

          .attachments-section {
               margin-top: 35px;
               border-top: 1px solid var(--border);
               padding-top: 23px;
          }

          .attachment-heading {
               display: flex;
               align-items: center;
               justify-content: space-between;
               margin-bottom: 17px;
          }

          .attachment-heading h3 {
               font-size: 13px;
          }

          .attachment-heading span {
               color: var(--muted);
               font-size: 11px;
          }

          .attachment-grid {
               display: grid;
               grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
               gap: 13px;
          }

          .attachment {
               position: relative;
               border: 1px solid var(--border);
               border-radius: 11px;
               overflow: hidden;
               background: white;
               min-width: 0;
          }

          .attachment img,
          .attachment video {
               width: 100%;
               height: 145px;
               display: block;
               object-fit: cover;
               background: #f0f0f0;
          }

          .attachment-info {
               padding: 10px;
          }

          .attachment-info p {
               font-size: 11px;
               overflow: hidden;
               white-space: nowrap;
               text-overflow: ellipsis;
               margin-bottom: 9px;
          }

          .attachment-actions {
               display: flex;
               gap: 7px;
          }

          .attachment-actions button {
               flex: 1;
               border: 1px solid var(--border);
               background: white;
               padding: 7px;
               border-radius: 6px;
               font-size: 10px;
          }

          .attachment-actions button:hover {
               color: var(--red);
               border-color: var(--red);
          }

          .upload-area {
               border: 1px dashed #e5b5bd;
               border-radius: 10px;
               padding: 24px;
               text-align: center;
               margin-top: 15px;
               background: #fffafb;
               cursor: pointer;
               color: var(--muted);
               font-size: 12px;
               transition: .2s;
          }

          .upload-area:hover {
               border-color: var(--red);
               background: var(--red-light);
          }

          .upload-area strong {
               color: var(--red);
          }

          /* EMPTY STATE */

          .empty-state {
               height: 100%;
               min-height: 450px;
               display: flex;
               flex-direction: column;
               justify-content: center;
               align-items: center;
               text-align: center;
          }

          .empty-icon {
               width: 85px;
               height: 85px;
               display: grid;
               place-items: center;
               border-radius: 24px;
               background: var(--red-light);
               color: var(--red);
               font-size: 38px;
               margin-bottom: 20px;
          }

          .empty-state h2 {
               font-size: 22px;
               margin-bottom: 10px;
          }

          .empty-state p {
               font-size: 13px;
               color: var(--muted);
               margin-bottom: 23px;
          }

          /* MOBILE */

          .overlay {
               display: none;
          }

          @media(max-width: 850px) {
               :root {
                    --sidebar: 260px;
               }

               .sidebar {
                    position: fixed;
                    left: -280px;
                    top: 0;
                    bottom: 0;
                    transition: .25s;
                    box-shadow: 10px 0 30px #00000010;
               }

               .sidebar.open {
                    left: 0;
               }

               .overlay.show {
                    display: block;
                    position: fixed;
                    inset: 0;
                    background: #0006;
                    z-index: 5;
               }

               .mobile-menu {
                    display: block;
               }

               .content {
                    padding: 30px 6%;
               }
          }

          @media(max-width: 520px) {
               .topbar {
                    padding: 0 14px;
                    height: 65px;
                    min-height: 65px;
               }

               .topbar-title {
                    display: none;
               }

               .content {
                    padding: 27px 18px;
               }

               .title-input {
                    font-size: 28px;
               }

               .editor {
                    font-size: 14px;
               }

               .topbar-actions {
                    gap: 5px;
               }

               .icon-btn {
                    width: 34px;
                    height: 34px;
               }

               .attachment-grid {
                    grid-template-columns: repeat(2, minmax(0, 1fr));
               }
          }
     </style>
</head>

<body>

     <div class="app">

          <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

          <!-- SIDEBAR -->
          <aside class="sidebar" id="sidebar">

               <div class="brand">
                    <div class="brand-icon">R</div>
                    <h2>Red<span>Note.</span></h2>
               </div>

               <div class="sidebar-content">

                    <button class="new-note" onclick="createNote()">
                         <span>＋</span> Create New Note
                    </button>

                    <div class="search-box">
                         <span class="search-icon">⌕</span>
                         <input type="search" id="search" placeholder="Search your notes..." oninput="renderNotes()">
                    </div>

                    <div class="nav-label">WORKSPACE</div>

                    <div class="nav-item active" id="allNav" onclick="setFilter('all')">
                         <span>▤</span> All Notes
                         <span class="count" id="allCount">0</span>
                    </div>

                    <div class="nav-item" id="pinnedNav" onclick="setFilter('pinned')">
                         <span>📌</span> Pinned Notes
                         <span class="count" id="pinnedCount">0</span>
                    </div>

                    <div class="notes-heading">
                         <h3>YOUR NOTES</h3>
                         <span id="notesCount">0 NOTES</span>
                    </div>

                    <div class="note-list" id="noteList"></div>

               </div>

               <div class="sidebar-footer">
                    RedNote · Your thoughts, organized.
               </div>

          </aside>

          <!-- MAIN -->
          <main class="main">

               <header class="topbar">

                    <div class="topbar-left">
                         <button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button>
                         <span class="topbar-title">Personal Workspace / <span id="currentName">No note
                                   selected</span></span>
                         <span class="save-status" id="saveStatus">Ready</span>
                    </div>

                    <div class="topbar-actions">
                         <button class="icon-btn" title="Pin note" onclick="togglePin()">📌</button>
                         <button class="icon-btn" title="Export note" onclick="exportNote()">↓</button>
                         <button class="icon-btn" title="Delete note" onclick="deleteNote()">🗑</button>
                    </div>

               </header>

               <section class="content" id="content">

                    <div class="empty-state">
                         <div class="empty-icon">✎</div>
                         <h2>Your space for ideas.</h2>
                         <p>Create your first note and start organizing your thoughts.</p>
                         <button class="new-note" style="width:auto;padding:13px 22px" onclick="createNote()">
                              ＋ Create your first note
                         </button>
                    </div>

               </section>

          </main>

     </div>

     <input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

     <script>

          /* =====================================
             REDNOTE DATABASE
          ===================================== */

          const DB_NAME = "RedNoteDatabase";
          const DB_VERSION = 1;

          let db;
          let notes = [];
          let currentNoteId = null;
          let currentAttachments = [];
          let objectUrls = [];
          let saveTimer = null;
          let filter = "all";

          function openDatabase() {
               return new Promise((resolve, reject) => {

                    const request = indexedDB.open(DB_NAME, DB_VERSION);

                    request.onupgradeneeded = e => {
                         const database = e.target.result;

                         if (!database.objectStoreNames.contains("notes")) {
                              database.createObjectStore("notes", { keyPath: "id" });
                         }

                         if (!database.objectStoreNames.contains("attachments")) {
                              database.createObjectStore("attachments", { keyPath: "id" });
                         }
                    };

                    request.onsuccess = e => resolve(e.target.result);
                    request.onerror = () => reject(request.error);
               });
          }

          function getStore(name, mode = "readonly") {
               return db.transaction(name, mode).objectStore(name);
          }

          function requestPromise(request) {
               return new Promise((resolve, reject) => {
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
               });
          }

          async function getAllNotes() {
               notes = await requestPromise(getStore("notes").getAll());

               notes.sort((a, b) => {
                    return Number(b.pinned) - Number(a.pinned) ||
                         b.updatedAt - a.updatedAt;
               });

               renderNotes();
          }

          /* =====================================
             CREATE NOTES
          ===================================== */

          async function createNote() {

               const note = {
                    id: crypto.randomUUID(),
                    title: "",
                    body: "",
                    pinned: false,
                    createdAt: Date.now(),
                    updatedAt: Date.now()
               };

               await requestPromise(
                    getStore("notes", "readwrite").put(note)
               );

               await getAllNotes();
               await openNote(note.id);

               if (window.innerWidth <= 850) {
                    toggleSidebar();
               }

               document.getElementById("noteTitle").focus();
          }

          /* =====================================
             DISPLAY NOTES
          ===================================== */

          function renderNotes() {

               const list = document.getElementById("noteList");
               const search = document.getElementById("search").value.toLowerCase();

               list.innerHTML = "";

               const visible = notes.filter(note => {

                    const matchesSearch =
                         (note.title || "").toLowerCase().includes(search) ||
                         stripHTML(note.body || "").toLowerCase().includes(search);

                    const matchesFilter =
                         filter === "all" || note.pinned;

                    return matchesSearch && matchesFilter;
               });

               document.getElementById("allCount").textContent = notes.length;
               document.getElementById("pinnedCount").textContent =
                    notes.filter(n => n.pinned).length;

               document.getElementById("notesCount").textContent =
                    visible.length + (visible.length === 1 ? " NOTE" : " NOTES");

               if (!visible.length) {
                    list.innerHTML = `
            <div style="padding:20px 10px;color:#aaa;font-size:12px;text-align:center">
                No notes found.
            </div>`;
                    return;
               }

               visible.forEach(note => {

                    const card = document.createElement("div");

                    card.className =
                         "note-card" +
                         (note.id === currentNoteId ? " selected" : "");

                    const title = document.createElement("h4");
                    title.textContent =
                         (note.pinned ? "📌 " : "") + (note.title || "Untitled note");

                    const preview = document.createElement("p");
                    preview.textContent = stripHTML(note.body || "") || "No content yet...";

                    const date = document.createElement("small");
                    date.textContent = formatDate(note.updatedAt);

                    card.append(title, preview, date);

                    card.onclick = () => openNote(note.id);

                    list.appendChild(card);
               });
          }

          function stripHTML(html) {
               const div = document.createElement("div");
               div.innerHTML = html;
               return div.textContent || div.innerText || "";
          }

          function formatDate(timestamp) {
               return new Date(timestamp).toLocaleDateString(undefined, {
                    day: "numeric",
                    month: "short",
                    year: "numeric"
               });
          }

          /* =====================================
             OPEN NOTE
          ===================================== */

          async function openNote(id) {

               if (currentNoteId) {
                    await saveCurrentNote();
               }

               currentNoteId = id;

               const note = notes.find(n => n.id === id);

               if (!note) return;

               revokeUrls();

               document.getElementById("currentName").textContent =
                    note.title || "Untitled note";

               document.getElementById("content").innerHTML = `

        <div class="editor-container">

            <div class="editor-meta">
                <span>CREATED ${formatDate(note.createdAt)}</span>
                <span class="dot"></span>
                <span id="updatedLabel">LAST UPDATED ${formatDate(note.updatedAt)}</span>
            </div>

            <input
                class="title-input"
                id="noteTitle"
                placeholder="Untitled note"
                value=""
                maxlength="150"
                oninput="scheduleSave()"
            >

            <div class="toolbar">

                <button class="tool-btn" onclick="format('bold')" title="Bold"><b>B</b></button>
                <button class="tool-btn" onclick="format('italic')" title="Italic"><i>I</i></button>
                <button class="tool-btn" onclick="format('underline')" title="Underline"><u>U</u></button>

                <span class="tool-divider"></span>

                <button class="tool-btn" onclick="format('formatBlock','h2')" title="Heading">H</button>
                <button class="tool-btn" onclick="format('insertUnorderedList')" title="Bullet list">☷</button>
                <button class="tool-btn" onclick="format('insertOrderedList')" title="Numbered list">1.</button>

                <span class="tool-divider"></span>

                <button class="tool-btn" onclick="format('removeFormat')" title="Clear formatting">Tx</button>

            </div>

            <div
                class="editor"
                id="noteBody"
                contenteditable="true"
                spellcheck="true"
                oninput="scheduleSave()"
            ></div>

            <div class="attachments-section">

                <div class="attachment-heading">
                    <h3>Media & Attachments</h3>
                    <span id="attachmentCount">0 files</span>
                </div>

                <div class="attachment-grid" id="attachmentGrid"></div>

                <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                    <div style="font-size:23px;margin-bottom:8px">＋</div>
                    <strong>Click to import images or videos</strong>
                    <p style="margin-top:7px">PNG, JPG, GIF, WEBP, MP4, WEBM and more</p>
                </div>

            </div>

        </div>
    `;

               document.getElementById("noteTitle").value = note.title || "";
               document.getElementById("noteBody").innerHTML = note.body || "";

               await loadAttachments(id);

               renderNotes();
               setStatus("Saved");
          }

          /* =====================================
             AUTO SAVE
          ===================================== */

          function scheduleSave() {

               setStatus("Saving...");

               clearTimeout(saveTimer);

               saveTimer = setTimeout(async () => {
                    await saveCurrentNote();
               }, 600);
          }

          async function saveCurrentNote() {

               if (!currentNoteId) return;

               clearTimeout(saveTimer);

               const titleInput = document.getElementById("noteTitle");
               const bodyInput = document.getElementById("noteBody");

               if (!titleInput || !bodyInput) return;

               const note = notes.find(n => n.id === currentNoteId);

               if (!note) return;

               note.title = titleInput.value.trim();
               note.body = bodyInput.innerHTML;
               note.updatedAt = Date.now();

               await requestPromise(
                    getStore("notes", "readwrite").put(note)
               );

               document.getElementById("currentName").textContent =
                    note.title || "Untitled note";

               const updatedLabel = document.getElementById("updatedLabel");

               if (updatedLabel) {
                    updatedLabel.textContent =
                         "LAST UPDATED " + formatDate(note.updatedAt);
               }

               setStatus("All changes saved");

               renderNotes();
          }

          function setStatus(message) {
               document.getElementById("saveStatus").textContent = message;
          }

          /* =====================================
             TEXT FORMATTING
          ===================================== */

          function format(command, value = null) {

               const editor = document.getElementById("noteBody");

               if (!editor) return;

               editor.focus();

               document.execCommand(command, false, value);

               scheduleSave();
          }

          /* =====================================
             PIN NOTES
          ===================================== */

          async function togglePin() {

               if (!currentNoteId) return;

               await saveCurrentNote();

               const note = notes.find(n => n.id === currentNoteId);

               note.pinned = !note.pinned;
               note.updatedAt = Date.now();

               await requestPromise(
                    getStore("notes", "readwrite").put(note)
               );

               await getAllNotes();

               setStatus(note.pinned ? "Note pinned" : "Pin removed");
          }

          /* =====================================
             DELETE NOTES
          ===================================== */

          async function deleteNote() {

               if (!currentNoteId) return;

               const confirmed = confirm(
                    "Are you sure you want to delete this note and its attachments?"
               );

               if (!confirmed) return;

               const noteId = currentNoteId;

               clearTimeout(saveTimer);

               const attachments = await requestPromise(
                    getStore("attachments").getAll()
               );

               const transaction = db.transaction(
                    ["notes", "attachments"],
                    "readwrite"
               );

               transaction.objectStore("notes").delete(noteId);

               attachments
                    .filter(a => a.noteId === noteId)
                    .forEach(a => transaction.objectStore("attachments").delete(a.id));

               await new Promise((resolve, reject) => {
                    transaction.oncomplete = resolve;
                    transaction.onerror = () => reject(transaction.error);
               });

               currentNoteId = null;

               revokeUrls();

               await getAllNotes();

               showEmptyState();
          }

          function showEmptyState() {

               document.getElementById("currentName").textContent = "No note selected";

               document.getElementById("content").innerHTML = `
        <div class="empty-state">
            <div class="empty-icon">✎</div>
            <h2>Your space for ideas.</h2>
            <p>Create a new note and start organizing your thoughts.</p>
            <button class="new-note" style="width:auto;padding:13px 22px"
                onclick="createNote()">
                ＋ Create New Note
            </button>
        </div>
    `;

               setStatus("Ready");
          }

          /* =====================================
             IMPORT IMAGES AND VIDEOS
          ===================================== */

          document.getElementById("fileInput").addEventListener("change", async function (e) {

               const files = Array.from(e.target.files);

               if (!currentNoteId) return;

               const accepted = files.filter(file =>
                    file.type.startsWith("image/") ||
                    file.type.startsWith("video/")
               );

               if (accepted.length !== files.length) {
                    alert("Only image and video files are supported.");
               }

               if (!accepted.length) {
                    e.target.value = "";
                    return;
               }

               setStatus("Importing media...");

               try {

                    for (const file of accepted) {

                         const attachment = {
                              id: crypto.randomUUID(),
                              noteId: currentNoteId,
                              name: file.name,
                              type: file.type,
                              size: file.size,
                              blob: file
                         };

                         await requestPromise(
                              getStore("attachments", "readwrite").put(attachment)
                         );
                    }

                    await loadAttachments(currentNoteId);

                    setStatus("Media imported successfully");

               } catch (error) {

                    console.error(error);

                    alert("Unable to import media. Your browser storage may be full.");

                    setStatus("Import failed");
               }

               e.target.value = "";
          });

          /* =====================================
             LOAD ATTACHMENTS
          ===================================== */

          async function loadAttachments(noteId) {

               currentAttachments = await requestPromise(
                    getStore("attachments").getAll()
               );

               currentAttachments = currentAttachments.filter(
                    a => a.noteId === noteId
               );

               renderAttachments();
          }

          function revokeUrls() {
               objectUrls.forEach(url => URL.revokeObjectURL(url));
               objectUrls = [];
          }

          function renderAttachments() {

               const grid = document.getElementById("attachmentGrid");

               if (!grid) return;

               grid.innerHTML = "";

               document.getElementById("attachmentCount").textContent =
                    currentAttachments.length +
                    (currentAttachments.length === 1 ? " file" : " files");

               currentAttachments.forEach(file => {

                    const url = URL.createObjectURL(file.blob);

                    objectUrls.push(url);

                    const card = document.createElement("div");
                    card.className = "attachment";

                    let media;

                    if (file.type.startsWith("image/")) {

                         media = document.createElement("img");
                         media.src = url;
                         media.alt = file.name;

                    } else {

                         media = document.createElement("video");
                         media.src = url;
                         media.controls = true;
                         media.preload = "metadata";
                    }

                    const info = document.createElement("div");
                    info.className = "attachment-info";

                    const name = document.createElement("p");
                    name.textContent = file.name;
                    name.title = file.name;

                    const actions = document.createElement("div");
                    actions.className = "attachment-actions";

                    const download = document.createElement("button");
                    download.textContent = "↓ Download";

                    download.onclick = () => downloadAttachment(file, url);

                    const remove = document.createElement("button");
                    remove.textContent = "Remove";

                    remove.onclick = () => removeAttachment(file.id);

                    actions.append(download, remove);
                    info.append(name, actions);
                    card.append(media, info);

                    grid.appendChild(card);
               });
          }

          /* =====================================
             EXPORT MEDIA
          ===================================== */

          function downloadAttachment(file, url) {

               const link = document.createElement("a");

               link.href = url;
               link.download = file.name;

               document.body.appendChild(link);
               link.click();
               link.remove();
          }

          /* =====================================
             REMOVE ATTACHMENT
          ===================================== */

          async function removeAttachment(id) {

               if (!confirm("Remove this attachment from the note?")) return;

               await requestPromise(
                    getStore("attachments", "readwrite").delete(id)
               );

               await loadAttachments(currentNoteId);

               setStatus("Attachment removed");
          }

          /* =====================================
             EXPORT NOTE
          ===================================== */

          async function exportNote() {

               if (!currentNoteId) {
                    alert("Select a note first.");
                    return;
               }

               await saveCurrentNote();

               const note = notes.find(n => n.id === currentNoteId);

               const textContent = stripHTML(note.body || "");

               const content = `
${note.title || "Untitled note"}

Created: ${new Date(note.createdAt).toLocaleString()}
Last updated: ${new Date(note.updatedAt).toLocaleString()}

${textContent}

Media files are exported separately using their Download buttons.
    `.trim();

               const blob = new Blob([content], {
                    type: "text/plain;charset=utf-8"
               });

               const url = URL.createObjectURL(blob);

               const link = document.createElement("a");

               link.href = url;
               link.download = (note.title || "RedNote").replace(/[\\/:*?"<>|]/g, "_") + ".txt";

               link.click();

               URL.revokeObjectURL(url);
          }

          /* =====================================
             FILTERS
          ===================================== */

          function setFilter(value) {

               filter = value;

               document.getElementById("allNav").classList.toggle(
                    "active", value === "all"
               );

               document.getElementById("pinnedNav").classList.toggle(
                    "active", value === "pinned"
               );

               renderNotes();
          }

          /* =====================================
             MOBILE SIDEBAR
          ===================================== */

          function toggleSidebar() {

               document.getElementById("sidebar").classList.toggle("open");
               document.getElementById("overlay").classList.toggle("show");
          }

          /* =====================================
             START APPLICATION
          ===================================== */

          async function init() {

               try {

                    db = await openDatabase();

                    await getAllNotes();

                    if (notes.length > 0) {
                         await openNote(notes[0].id);
                    }

               } catch (error) {

                    console.error(error);

                    document.getElementById("content").innerHTML = `
            <div class="empty-state">
                <h2>Unable to open RedNote</h2>
                <p>Please check that your browser supports IndexedDB.</p>
            </div>
        `;
               }
          }

          window.addEventListener("beforeunload", () => {
               clearTimeout(saveTimer);
               revokeUrls();
          });

          init();

     </script>

</body>

</html>
